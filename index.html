<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Kei 💖</title>

<style>
*{
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd1e8,#ff9acb);
  overflow:hidden;
}

.card{
  background:white;
  padding:30px;
  border-radius:25px;
  text-align:center;
  width:340px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

h1{
  margin:0;
}

.question{
  margin:20px 0;
  font-weight:bold;
}

.buttons{
  display:flex;
  justify-content:space-around;
  gap:10px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

#yes{
  background:black;
  color:white;
}

#yes:hover{
  transform:scale(1.1);
}

#no{
  background:#eee;
  position:relative;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Hey Kei 💌</h1>
  <p>Hunter tiene una pregunta…</p>

  <div class="question">
    ¿Quieres ser mi San Valentín y mi princesita, Kei?
  </div>

  <div class="buttons">
    <button id="yes">Sí 💖</button>
    <button id="no">No</button>
  </div>
</div>

<script>
var yesBtn = document.getElementById("yes");
var noBtn = document.getElementById("no");

var intentos = 0;

function moverNo() {
  intentos++;

  if (intentos < 5) {
    var x = Math.random() * 250 - 125;
    var y = Math.random() * 250 - 125;
    noBtn.style.transform = "translate(" + x + "px," + y + "px)";
  } else {
    noBtn.style.display = "none";
  }
}

// PC
noBtn.addEventListener("mouseover", moverNo);

// Celular
noBtn.addEventListener("touchstart", function(e){
  e.preventDefault();
  moverNo();
});

// Botón SÍ
yesBtn.addEventListener("click", function(){
  document.body.innerHTML = `
  <div style="
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9acb,#ff4fa3);
    color:white;
    text-align:center;
  ">
    <div>
      <h1>💖 Sabía que dirías que sí, Kei 💖</h1>
      <h2>Con amor, Hunter 🥹💘</h2>
    </div>
  </div>
  `;
});
</script>

</body>
</html>
