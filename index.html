<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Kei 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd1e8,#ff9acb);
  font-family:Segoe UI, sans-serif;
  overflow:hidden;
}

.card{
  background:white;
  padding:30px;
  border-radius:25px;
  text-align:center;
  width:320px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  position:relative;
}

.buttons{
  margin-top:20px;
  position:relative;
  height:60px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
  position:absolute;
}

#yes{
  background:black;
  color:white;
  left:20px;
}

#no{
  background:#eee;
  right:20px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Hey Kei 💌</h2>
  <p>Hunter tiene una pregunta…</p>
  <p><b>¿Quieres ser mi San Valentín y mi princesita, Kei?</b></p>

  <div class="buttons">
    <button id="yes">Sí 💖</button>
    <button id="no">No</button>
  </div>
</div>

<script>
var yesBtn = document.getElementById("yes");
var noBtn = document.getElementById("no");
var intentos = 0;

function moverNo(){
  intentos++;

  if(intentos < 5){
    var randomX = Math.random() * 200;
    var randomY = Math.random() * 30;
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
  } else {
    noBtn.style.display = "none";
  }
}

noBtn.addEventListener("touchstart", function(e){
  e.preventDefault();
  moverNo();
});

noBtn.addEventListener("mouseover", moverNo);

yesBtn.addEventListener("click", function(){
  document.body.innerHTML = `
  <div style="
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9acb,#ff4fa3);
    color:white;
    text-align:center;
    font-family:Segoe UI;
  ">
    <div>
      <h1>💖 Sabía que dirías que sí, Kei 💖</h1>
      <h2>Con amor, Hunter 🥹💘</h2>
    </div>
  </div>
  `;
});
</script>

</body>
</html>
